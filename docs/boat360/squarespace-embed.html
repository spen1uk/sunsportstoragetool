<!--
  Sun Sport 360° viewer — Squarespace embed snippet.

  Paste into a Code Block on the boat's product page (Code Block → HTML,
  "Display source code" OFF). Replace:
    VIEWER_ORIGIN  → where the viewer is hosted, e.g. https://viewer.sunsportmarineinc.com
    BOAT_SLUG      → the boat's slug, e.g. harris-kayot-220-classic  (appears twice)
    BOAT_TITLE     → e.g. 2000 Harris-Kayot 220 Classic
  The iframe sizes itself to the viewer's height, and on iPhones it expands
  to cover the screen when the customer taps fullscreen.
-->
<div class="sunsport-360" style="width:100%;max-width:1400px;margin:0 auto">
  <iframe
    id="boat360-BOAT_SLUG"
    src="VIEWER_ORIGIN/embed/boats/BOAT_SLUG"
    title="BOAT_TITLE — interactive 360° view"
    style="display:block;width:100%;height:900px;border:0;background:transparent"
    allow="fullscreen"
    allowfullscreen
    loading="lazy"
  ></iframe>
</div>
<script>
  (function () {
    var ORIGIN = "VIEWER_ORIGIN";
    window.addEventListener("message", function (e) {
      if (e.origin !== ORIGIN || !e.data || typeof e.data !== "object") return;
      var frame = document.getElementById("boat360-" + e.data.slug);
      if (!frame) return;
      if (e.data.type === "boat360:height" && !frame.dataset.fullscreen) {
        frame.style.height = e.data.height + "px";
      } else if (e.data.type === "boat360:fullscreen") {
        if (e.data.on) {
          frame.dataset.fullscreen = "1";
          frame.dataset.prevHeight = frame.style.height;
          frame.style.cssText += ";position:fixed;inset:0;width:100vw;height:100dvh;z-index:2147483647;background:#06152b";
          document.documentElement.style.overflow = "hidden";
        } else {
          delete frame.dataset.fullscreen;
          frame.style.position = "";
          frame.style.inset = "";
          frame.style.width = "100%";
          frame.style.height = frame.dataset.prevHeight || "900px";
          frame.style.zIndex = "";
          frame.style.background = "transparent";
          document.documentElement.style.overflow = "";
        }
      }
    });
  })();
</script>
