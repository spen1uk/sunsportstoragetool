# From the trading-bot folder:  docker compose -f deploy/docker-compose.yml up -d --build
services:
  tradebot:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: always          # comes back after crashes and reboots
    volumes:
      - ../data:/app/data    # journal, trade log, state survive restarts/upgrades
    environment:
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
